# Development stack: Postgres 16 + Go server (API + game host, real game
# module) + Next.js dev server (+ optional Caddy: `--profile proxy`).
#   docker compose -f deploy/docker-compose.dev.yml up --build
# The demo pak is read from ../assets (run `make demo` first); it is
# ingested into the blob store on start and games load their maps from it.
#   API/WebSocket: http://localhost:8080 (/api/v1/..., /ws/v1/games/{id})
#   Postgres:      localhost:${Q2_DEV_PG_PORT:-5433} (q2/q2)
#   Web:           http://localhost:3000
name: q2web-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: q2
      POSTGRES_PASSWORD: q2
      POSTGRES_DB: q2
    ports:
      - "127.0.0.1:${Q2_DEV_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U q2 -d q2"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://q2:q2@postgres:5432/q2?sslmode=disable
      Q2_HTTP_ADDR: ":8080"
      Q2_BLOB_DIR: /data/blobs
      Q2_DEMO_PAK: /assets/demo/baseq2/pak0.pak
      Q2_COOKIE_SECURE: "false"
      Q2_CORS_ORIGINS: http://localhost:3000
      Q2_LOG_FORMAT: text
      Q2_LOG_LEVEL: info
      # AI bots (see .env.example): the run directories live on the data
      # volume, the nav cache and route tables come from the bind mounts;
      # TYPESAFE_API_KEY stays server side (from ../.env, never the web app)
      Q2_BOTS_ENABLED: ${Q2_BOTS_ENABLED:-true}
      Q2_BOTS_MAX: ${Q2_BOTS_MAX:-4}
      Q2_BOTS_PER_USER: ${Q2_BOTS_PER_USER:-1}
      Q2_BOTS_ALLOW_USERS: ${Q2_BOTS_ALLOW_USERS:-true}
      Q2_BOT_MAX_VIEWERS: ${Q2_BOT_MAX_VIEWERS:-8}
      Q2_BOT_RUNS_DIR: /data/bots
      Q2_BOT_RUNS_KEEP: ${Q2_BOT_RUNS_KEEP:-50}
      Q2_BOT_MAX_RUN: ${Q2_BOT_MAX_RUN:-30m}
      Q2_BOT_BUDGET_USD_PER_RUN: ${Q2_BOT_BUDGET_USD_PER_RUN:-1}
      Q2_BOT_BUDGET_USD_PER_DAY: ${Q2_BOT_BUDGET_USD_PER_DAY:-5}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_ALLOW_CUSTOM_BASE: ${JEV_ALLOW_CUSTOM_BASE:-false}
      Q2_JEV_MODEL: ${Q2_JEV_MODEL:-jev-1.13.0}
      Q2_JEV_MAX_QPS: ${Q2_JEV_MAX_QPS:-20}
      Q2_NAV_DIR: /assets/nav
      Q2_ROUTES_DIR: /fixtures/agent/routes
    # flags: -gamemodule stub, -map demo1 -mode dm (a default public game),
    # -idle 5m, -udp :27910 (then also publish 27910/udp),
    # -bot demo1,demo2,demo3 -bot-backend scripted (a public demo bot)
    command: ["-idle", "10m"]
    ports:
      - "8080:8080"
    volumes:
      - blobs:/data
      - ../assets:/assets:ro
      - ../fixtures:/fixtures:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/q2server", "-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js dev server with the workspace bind-mounted (web/apps/web).
  web:
    image: node:22-bookworm-slim
    working_dir: /src/web
    command: sh -c "corepack enable && pnpm install && pnpm --filter ./apps/web dev --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # dev rewrites (/api, /assets, /ws) go to the server container; game WebSockets connect to the
      # published server port directly (web/apps/web/next.config.ts, src/lib/env.ts)
      Q2_SERVER_URL: http://server:8080
      NEXT_PUBLIC_Q2_SERVER: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ../web:/src/web
      - web_node_modules:/src/web/node_modules
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2
    profiles: ["proxy"]
    environment:
      Q2_SITE_ADDRESS: ":80"
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
      - web

volumes:
  pgdata:
  blobs:
  web_node_modules:
