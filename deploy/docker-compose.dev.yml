# Development stack: Postgres 16 + Go server + Next.js dev server
# (+ optional Caddy: `--profile proxy`).
#   docker compose -f deploy/docker-compose.dev.yml up --build
# The demo pak is read from ../assets (run `make demo` first).
name: q2web-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: q2
      POSTGRES_PASSWORD: q2
      POSTGRES_DB: q2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U q2 -d q2"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://q2:q2@postgres:5432/q2?sslmode=disable
      Q2_HTTP_ADDR: ":8080"
      Q2_BLOB_DIR: /data/blobs
      Q2_DEMO_PAK: /assets/demo/baseq2/pak0.pak
      Q2_COOKIE_SECURE: "false"
      Q2_CORS_ORIGINS: http://localhost:3000
      Q2_LOG_FORMAT: text
      Q2_LOG_LEVEL: debug
    ports:
      - "8080:8080"
    volumes:
      - blobs:/data
      - ../assets:/assets:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Placeholder: Next.js dev server with the workspace bind-mounted.
  web:
    image: node:22-bookworm-slim
    working_dir: /src/web
    command: sh -c "corepack enable && pnpm install && pnpm --filter ./apps/web dev --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ../web:/src/web
      - web_node_modules:/src/web/node_modules
    depends_on:
      - server

  caddy:
    image: caddy:2
    profiles: ["proxy"]
    environment:
      Q2_SITE_ADDRESS: ":80"
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - server
      - web

volumes:
  pgdata:
  blobs:
  web_node_modules:
