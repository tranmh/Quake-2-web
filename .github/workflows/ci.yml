name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - run: tools/check-oracle-untouched.sh && tools/parity-check.sh

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/cache@v4
        with:
          path: assets
          key: q2demo-${{ hashFiles('tools/demo.sha256') }}
      - run: make demo
      - run: make fixtures
      - run: git diff --exit-code fixtures/MANIFEST.sha256
      - uses: actions/upload-artifact@v4
        with: { name: fixtures, path: fixtures/generated, retention-days: 3 }

  gen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod }
      - run: make gen-check

  go:
    needs: fixtures
    runs-on: ubuntu-latest
    env:
      GOAMD64: v1
      DATABASE_URL_TEST: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
      # CI never calls the paid Jev API (the jev client's test-binary guard also refuses non-loopback hosts)
      TYPESAFE_API_KEY: ""
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod }
      - uses: actions/cache@v4
        with:
          path: assets
          key: q2demo-${{ hashFiles('tools/demo.sha256') }}
      - run: make demo
      # the agent's nav graphs: without them the -race full-map nav tests skip (a -race build takes ~30 s/map)
      - run: make nav
      # a scripted demo1 run and a noisy mock-Jev demo1 run held to the provenance gate (0.7), both validated
      - run: make agent-smoke
      - uses: actions/download-artifact@v4
        with: { name: fixtures, path: fixtures/generated }
      - run: cd server && go vet ./... && test -z "$(gofmt -l .)"
      - run: cd server && go test -race ./...
      - run: cd server && go test -tags golden ./...

  ts:
    needs: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - uses: actions/cache@v4
        with:
          path: assets
          key: q2demo-${{ hashFiles('tools/demo.sha256') }}
      - run: make demo
      - uses: actions/download-artifact@v4
        with: { name: fixtures, path: fixtures/generated }
      - run: cd web && pnpm install --frozen-lockfile && pnpm -r typecheck && pnpm lint && pnpm -r test && pnpm --filter web build

  # Playwright against a real q2server + next start: play.spec.ts (register, start demo1, play) and
  # watch.spec.ts (start a scripted bot, watch it live, replay it), plus the dev harness render tests
  # (incl. the ?nav=1 overlay). Q2_E2E_REQUIRE=1: a self-skip (no Chromium, Go, pak, bots) is a failure.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      Q2_E2E_REQUIRE: "1"
      TYPESAFE_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - uses: actions/cache@v4
        with:
          path: assets
          key: q2demo-${{ hashFiles('tools/demo.sha256') }}
      - run: make demo
      - run: make nav
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web/apps/web && npx playwright install --with-deps chromium
      - run: make e2e
      - run: cd web && pnpm --filter q2-dev e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            web/apps/web/playwright-report
            web/apps/web/test-results
            web/apps/web/.e2e/*.log
            web/apps/dev/playwright-report
            web/apps/dev/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - run: docker build -f deploy/Dockerfile.server -t q2web-server .
      - run: docker build -f deploy/Dockerfile.web -t q2web-web .
